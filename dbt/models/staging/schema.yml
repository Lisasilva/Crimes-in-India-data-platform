version: 2

models:
  - name: stg_kaggle__state_crimes
    description: Kaggle file with proper types. Names and values are unchanged.
    columns:
      - name: name_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('state_names')
                field: name_key
      - name: year
        tests: [not_null]

  - name: stg_ncrb__cases_2001_2010
    description: NCRB 2001-2010 file with proper types. Names and values are unchanged.
    columns:
      - name: name_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('state_names')
                field: name_key
      - name: cases_reported
        tests: [not_null]

  - name: stg_ncrb__population
    description: >
      NCRB state totals with the population and rate NCRB used, one row per
      source, state, year and measure.
    columns:
      - name: measure
        tests:
          - accepted_values:
              arguments:
                values: ['cases', 'population_lakhs', 'published_rate']
      - name: value
        tests:
          - not_null
          - value_in_range:
              arguments:
                min_value: 0
