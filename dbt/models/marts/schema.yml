version: 2

models:
  - name: dim_state
    description: States and union territories as analysed. Merged units list their parts in `includes`.
    columns:
      - name: analysis_unit
        tests: [unique, not_null]
      - name: unit_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['State', 'Union Territory']
      - name: female_population_2011
        tests: [not_null]

  - name: dim_crime_type
    description: The crime types of the women view (seven heads and the total), with definition changes.
    columns:
      - name: crime_code
        tests: [unique, not_null]

  - name: fct_crimes_against_women
    description: >
      Cases and rate per 100,000 women for each state, year and crime type,
      2001-2024, from NCRB's own crimes-against-women tables. Rates use the
      female population NCRB used that year; `female_population_basis` marks
      2001-2011, where it is estimated (see dim_population).
    columns:
      - name: fact_id
        tests: [unique, not_null]
      - name: analysis_unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: analysis_unit
      - name: crime_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crime_type')
                field: crime_code
      - name: year
        tests:
          - not_null
          - value_in_range:
              arguments:
                min_value: 2001
                max_value: 2024
      - name: female_population
        tests: [not_null]
      - name: cases
        tests:
          - not_null
          - value_in_range:
              arguments:
                min_value: 0
      - name: rate_per_100k_women
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 1000

  - name: dim_population
    description: >
      The population NCRB used for its rates, per analysis unit and year:
      mid-year projected total population, and female population from 2012.
      For 2001-2011 the female population is estimated from the total and the
      Census 2011 female share, because NCRB did not publish it.
    columns:
      - name: analysis_unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: analysis_unit
      - name: year
        tests: [not_null]
      - name: population
        tests:
          - not_null
          - value_in_range:
              arguments:
                min_value: 10000
      - name: female_population
        tests: [not_null]
      - name: female_population_basis
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'NCRB female population'
                  - 'Estimated: NCRB population x Census 2011 female share'
    tests:
      - unique_combination:
          arguments:
            columns: [analysis_unit, year]

  - name: mart_state_crime_profile
    description: Average yearly rate per 100,000 women by crime type over the profile window; one row per state.
    columns:
      - name: analysis_unit
        tests: [unique, not_null]

  - name: mart_state_all_crime_profile
    description: >
      Average yearly rate per 100,000 people by crime group over the profile
      window; one row per state. The input to the all-crimes clustering.
    columns:
      - name: analysis_unit
        tests: [unique, not_null]
      - name: years_with_data
        tests:
          - accepted_values:
              arguments:
                values: [5]

  - name: mart_national_trend
    description: All-India cases and rate per crime type and year.

  - name: mart_source_comparison
    description: >
      The Kaggle file against the original NCRB 2001-2010 women file, figure by
      figure, before any correction. Both feed only the Kaggle backup
      (int_state_crimes_long).
    columns:
      - name: comparison
        tests:
          - accepted_values:
              arguments:
                values: ['match', 'only in NCRB file']

  - name: dim_crime_group
    description: The crime groups of fct_crimes, with whether each is a crime against women and the years covered.
    columns:
      - name: crime_group
        tests: [unique, not_null]

  - name: fct_crimes
    description: >
      Cases and rate per 100,000 people for each state, year and crime group,
      for all IPC/BNS crimes, 2001-2024. 2001-2013 come from the district-wise
      files (state total rows), 2014-2024 from NCRB's state tables.
    columns:
      - name: fact_id
        tests: [unique, not_null]
      - name: analysis_unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: analysis_unit
      - name: crime_group
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crime_group')
                field: crime_group
      - name: year
        tests:
          - not_null
          - value_in_range:
              arguments:
                min_value: 2001
                max_value: 2024
      - name: population
        tests: [not_null]
      - name: cases
        tests:
          - value_in_range:
              arguments:
                min_value: 0

  - name: mart_national_crime_trend
    description: All-India cases and rate per 100,000 people per crime group and year, 2001-2024.

  - name: mart_crime_source_overlap
    description: >
      Figures that two sources both report, side by side: the 2014 district
      file against NCRB table 1.6, NCRB's women tables against its all-crimes
      tables, and the Kaggle women file (kept as a backup) against NCRB's
      women tables.
    columns:
      - name: comparison
        tests:
          - accepted_values:
              arguments:
                values: ['match', 'different', 'missing in one source']
